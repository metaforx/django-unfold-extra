line-length = 120
target-version = "py312"
extend-exclude = [
    "migrations",
    "*migrations",
]
# pre-commit passes file paths explicitly; without this, ruff checks them even
# when they match extend-exclude (e.g. vendored gwr/overrides/*migrations).
force-exclude = true

[lint]
select = ["I", ]

[lint.isort]
combine-as-imports = true

[format]
quote-style = "double"
